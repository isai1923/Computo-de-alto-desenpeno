name: Deploy Data Visualization to GitHub Pages

# 1. Cuándo ejecutar la acción
on:
  push:
    branches:
      - main  # O la rama que uses como principal

# 2. Permisos necesarios
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 3. Obtener tu código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 5. Instalar las librerías necesarias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Ejecutar el script de Python
      # Las credenciales de ES se inyectan de forma segura aquí
      - name: Run data processing script
        run: python process_data.py
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_API_KEY: ${{ secrets.ES_API_KEY }}

      # 7. Preparar el archivo para GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sube todo el directorio
          # Busca específicamente el index.html
          # Si solo quieres subir el HTML, usa:
          # path: './index.html'

      # 8. Desplegar en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
